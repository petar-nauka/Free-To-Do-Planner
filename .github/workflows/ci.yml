# Автоматична проверка при всяко качване в GitHub.
# Пуска същото, което локално е `npm run check` (frontend/package.json).
# Задейства се от първия push след добавянето на този файл.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: frontend — типове, тестове, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Инсталация (точно по lock файла)
        run: npm ci

      - name: Типове
        run: npm run typecheck

      - name: Тестове
        run: npm run test

      # Заварени са 133 проблема (главно `any`). Докато не се изчистят, lint
      # само ОТЧИТА и не спира проверката. Когото стигнат нула — махни
      # `continue-on-error` и стават задължителни.
      - name: Lint (само отчита)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Build-ът не се свързва с базата; стойностите са само за да не са undefined.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
