<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy:
      - default-src 'self' — only allow resources from same origin
      - script-src — allow self + unsafe-inline (Vite HMR / React). Tighten in prod.
      - img-src — allow images from self + data: (for inline thumbnails) + https:
      - connect-src — allow Supabase + backend API + any HTTPS
      - object-src 'none' — block Flash/plugins
      NOTE: frame-ancestors must be set as HTTP header on the web server,
      it's ignored when delivered via <meta>. Set X-Frame-Options: DENY
      and Content-Security-Policy: frame-ancestors 'none' in nginx/caddy.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: https:;
      connect-src 'self' https: wss: ws:;
      frame-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Free To-Do Planner</title>
    <meta name="description" content="Управление на проекти и задачи" />

    <!-- Инсталиране на телефона като приложение (PWA) + иконки. iPhone чете
         apple-* таговете и apple-touch-icon, Android/Chrome — manifest-а. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="To Do" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:title" content="Free To-Do Planner" />
    <meta property="og:description" content="Self-hosted planner for projects, tasks, notes and spreadsheets" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
