<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Иконка „Kanban колони" (избрана 2026-10-22). Фонът стига до ръба; рисунката е в
       централния кръг (радиус 40%), за да оцелее при изрязването на Android. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9056f5"/>
      <stop offset="1" stop-color="#6a2fd6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="128" y="140" width="68" height="232" rx="20" fill="#ffffff"/>
  <rect x="222" y="140" width="68" height="160" rx="20" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="316" y="140" width="68" height="196" rx="20" fill="#ffffff" fill-opacity="0.7"/>
</svg>
